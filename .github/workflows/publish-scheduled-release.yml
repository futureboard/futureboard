name: Publish Scheduled Release

# GitHub's API cannot back-date or pre-set `published_at` on a draft: a release
# becomes public at the moment it is published. Publishing on a timer is the
# only way to hit a planned release moment, so this workflow flips the prepared
# draft to public at 2026-08-08 16:00 Asia/Bangkok (09:00 UTC).
#
# It only ever changes the draft flag. Assets and release notes must already be
# on the release — `release.yml` stages them on its own schedule 45 minutes
# earlier, or run it manually with visibility `draft`.

on:
  schedule:
    - cron: "0 9 8 8 *" # 09:00 UTC on 8 August == 16:00 GMT+7
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        type: string
        required: true
      ignore-date-guard:
        description: Publish even when today is not the planned release date.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # The planned release. The cron fires every 8 August, so both guards below
  # keep it a one-shot for this specific release.
  SCHEDULED_TAG: 2026.8.8-beta1
  SCHEDULED_DATE: 2026-08-08

jobs:
  publish:
    name: Publish Draft
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Resolve target release
        id: target
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "tag=${TAG:-$SCHEDULED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check the planned release date
        id: guard
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          if [ "${{ inputs.ignore-date-guard }}" = "true" ]; then
            echo "Date guard bypassed by dispatch input."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$TODAY" = "$SCHEDULED_DATE" ]; then
            echo "Today is the planned release date."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Today is $TODAY, planned date is $SCHEDULED_DATE — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the release is a draft with assets
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          gh release view "$TAG" --json tagName,isDraft,assets > release.json
          cat release.json
          test "$(jq -r '.isDraft' release.json)" = "true" \
            || { echo "::error::$TAG is already published"; exit 1; }
          test "$(jq '.assets | length' release.json)" -gt 0 \
            || { echo "::error::$TAG has no assets — run Release Build first"; exit 1; }

      - name: Publish
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          gh release edit "$TAG" --draft=false --prerelease=true --latest=false
          gh release view "$TAG" --json tagName,isDraft,publishedAt
