[package]
name = "burnlimit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "BurnLimit — modern brickwall limiter DSP core (Pro-L / Ozone–inspired)"

[lib]
name = "burnlimit"
# `rlib` for the umbrella crate / tests; `cdylib` so it also compiles as a
# Built-in Plugin dynamic library (C entry points are a later slice).
crate-type = ["rlib", "cdylib"]

[dependencies]
builtin-dsp-core.workspace = true
builtin-ui-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# Build-time only: `build.rs` compiles the editor into Cargo's OUT_DIR, then
# turns that bundle into the embedded asset table. Keep this pointed at the
# dependency-free generator, never the `BuiltinAudioPlugins` umbrella.
builtin-ui-embed = { workspace = true, features = ["generate"] }

[lints]
workspace = true
