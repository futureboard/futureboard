[package]
name = "equzx"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "EQ-ZX — 24-band dynamic mid/side parametric EQ DSP core (biquad)"

[lib]
name = "equzx"
# `rlib` for the umbrella crate / tests; `cdylib` so it also compiles as a
# Built-in Plugin dynamic library (C entry points are a later slice).
crate-type = ["rlib", "cdylib"]

[dependencies]
biquad.workspace = true
builtin-dsp-core.workspace = true
builtin-ui-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# Build-time only: turns `editor/dist` into the embedded asset table.
#
# Must stay pointed at the dependency-free `builtin_ui_embed`, never at the
# `BuiltinAudioPlugins` umbrella — a build-dependency is a separate build unit
# and would rebuild every plugin `cdylib` into the same output path.
builtin-ui-embed = { workspace = true, features = ["generate"] }

[lints]
workspace = true
