[package]
name = "SphereSoundfontPlayer"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "SphereSoundfontPlayer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Exposes `test_font`, a synthetic SoundFont used by this crate's tests and by
# the audio engine's tests. Never enabled by the shipping binaries.
test-support = []

[dependencies]
rustysynth = "1.3.6"
# The amp-envelope and render-quality settings are persisted in the project file
# and carried in the engine's track snapshot, so their types are defined here
# (one authority) and serialized by the layers above.
serde.workspace = true

[lints]
workspace = true
