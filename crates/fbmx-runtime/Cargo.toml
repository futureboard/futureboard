[package]
name = "fbmx-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust loader and realtime inference runtime for .fbmx neural audio models"

# serde_json parses the header, at load time only. Nothing in the realtime path
# touches it. SHA-256 is implemented in-crate rather than pulled in, so the
# whole dependency surface of an audio plugin that ships this is two crates.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "fbmx-bench"
path = "src/bin/bench.rs"

[dev-dependencies]
serde_json = { workspace = true }
